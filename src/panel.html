<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  /* Deep plum and gold, matching Tenhou's own lobby */
  :root {
    --bg: #141019;
    --side: #19131f;
    --surface: #211a2b;
    --surface-2: #2a2237;
    --hover: #33294a;
    --line: #2f2640;
    --text: #f3eef9;
    --muted: #a99cbd;
    --faint: #7a6d8f;
    --gold: #e6c36a;
    --gold-2: #c9973b;
    --gold-ink: #2a1d06;
    --violet: #b294f5;
    --violet-bg: rgba(157, 123, 234, .14);
    --violet-line: rgba(157, 123, 234, .45);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  body {
    display: grid; grid-template-columns: 220px 1fr;
    background:
      radial-gradient(900px 500px at 110% -20%, rgba(124, 82, 214, .28), transparent 60%),
      radial-gradient(600px 400px at -10% 120%, rgba(230, 195, 106, .08), transparent 60%),
      var(--bg);
  }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Sidebar ---- */
  aside {
    display: flex; flex-direction: column; gap: 4px;
    padding: 20px 14px; background: rgba(25, 19, 31, .85);
    border-right: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(145deg, #3a2a57, #241a35);
    border: 1px solid rgba(230, 195, 106, .45);
    color: var(--gold); font: 700 20px/1 "Yu Gothic UI", "Meiryo", sans-serif;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .brand b { display: block; font-size: 15px; }
  .brand small { color: var(--faint); font-size: 12px; }

  .nav {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; color: var(--muted); font: inherit; text-align: left; cursor: pointer;
    position: relative;
  }
  .nav:hover { background: rgba(255, 255, 255, .04); color: var(--text); }
  .nav[aria-selected="true"] {
    color: var(--gold);
    background: linear-gradient(90deg, rgba(230, 195, 106, .16), rgba(230, 195, 106, .02));
  }
  .nav[aria-selected="true"]::before {
    content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--gold);
  }
  .spacer { flex: 1; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; padding: 12px 8px; color: var(--faint); font-size: 12px; align-items: center; }
  kbd {
    font: 600 11px/1 "Segoe UI", sans-serif; color: var(--muted);
    padding: 4px 6px; border-radius: 5px; background: var(--surface-2);
    border: 1px solid var(--line); border-bottom-width: 2px; text-align: center;
  }
  .exit {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px; border-radius: 10px; border: 1px solid var(--line);
    background: none; color: var(--muted); font: inherit; cursor: pointer;
  }
  .exit:hover { color: #ffb4a8; border-color: rgba(255, 140, 120, .4); background: rgba(255, 120, 100, .06); }

  /* ---- Content ---- */
  main { overflow-y: auto; padding: 26px 30px 30px; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 5px; border: 2px solid var(--bg); }
  section { display: none; max-width: 980px; }
  section.active { display: block; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .sub { margin: 4px 0 22px; color: var(--muted); }
  h2 { margin: 26px 0 10px; font-size: 12px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 16px; border-radius: 10px; border: 1px solid transparent;
    font-family: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.2; cursor: pointer; white-space: nowrap;
    transition: transform .08s, filter .15s, background .15s;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn svg.i { width: 16px; height: 16px; }
  .btn.gold {
    color: var(--gold-ink);
    background: linear-gradient(180deg, var(--gold), var(--gold-2));
    box-shadow: 0 6px 16px rgba(201, 151, 59, .28), inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  .btn.gold:hover { filter: brightness(1.07); }
  .btn.violet { color: var(--violet); background: var(--violet-bg); border-color: var(--violet-line); }
  .btn.violet:hover { background: rgba(157, 123, 234, .22); }
  .btn.ghost { color: var(--text); background: var(--surface-2); border-color: var(--line); }
  .btn.ghost:hover { background: var(--hover); }
  .btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: rgba(157, 123, 234, .2); color: var(--violet); }

  /* Last game hero */
  .hero {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 22px 24px; border-radius: 16px;
    background: linear-gradient(135deg, #2e2245 0%, #221a30 55%, #1d1628 100%);
    border: 1px solid rgba(230, 195, 106, .28);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .35);
  }
  .hero::after {
    content: "✦"; position: absolute; left: -18px; bottom: -58px;
    font-size: 120px; color: rgba(230, 195, 106, .07); pointer-events: none;
  }
  .hero .info { flex: 1; min-width: 220px; }
  .eyebrow { color: var(--gold); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; }
  .when { font-size: 28px; font-weight: 700; margin: 2px 0 8px; letter-spacing: -.01em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); color: var(--muted); }
  .chip.mono { font-family: Consolas, monospace; }
  .hero .actions { display: flex; flex-direction: column; gap: 8px; min-width: 250px; position: relative; z-index: 1; }
  .hero .actions .btn { justify-content: flex-start; }
  .hero .actions .btn .badge { margin-left: auto; }
  .tools { display: flex; gap: 8px; margin-top: 12px; }

  /* History */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px 10px 16px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    transition: background .15s, border-color .15s;
  }
  .item:hover { background: var(--surface-2); border-color: #3c3152; }
  .item .date { font-weight: 650; min-width: 96px; }
  .item .meta { flex: 1; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .item .actions { display: flex; gap: 6px; }
  .empty {
    padding: 28px; border-radius: 16px; text-align: center; color: var(--muted);
    border: 1px dashed var(--line); background: rgba(255, 255, 255, .02);
  }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* Settings rows with switches */
  .group { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  .setting {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; cursor: pointer;
  }
  .setting + .setting { border-top: 1px solid var(--line); }
  .setting:hover { background: rgba(255, 255, 255, .025); }
  .setting .text { flex: 1; }
  .setting .text b { display: block; font-weight: 600; }
  .setting .text span { color: var(--muted); font-size: 12.5px; }
  .setting .icon {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--surface-2); color: var(--gold);
  }

  input[type=checkbox].switch {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
    width: 44px; height: 24px; border-radius: 99px; position: relative;
    background: #3a3050; transition: background .2s;
  }
  input[type=checkbox].switch::before {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: #d9d0e6; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); transition: transform .2s, background .2s;
  }
  input[type=checkbox].switch:checked { background: linear-gradient(180deg, var(--gold), var(--gold-2)); }
  input[type=checkbox].switch:checked::before { transform: translateX(20px); background: #fff; }

  .zoom { display: flex; align-items: center; gap: 12px; }
  .zoom output { min-width: 48px; text-align: right; font-weight: 650; color: var(--gold); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 220px; height: 6px; border-radius: 99px; background: #3a3050; outline: none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    background: linear-gradient(180deg, var(--gold), var(--gold-2)); box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
  }

  .field { display: flex; gap: 8px; align-items: center; }
  .field input {
    flex: 1; min-width: 0; max-width: 320px; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; font-size: 13.5px; user-select: text;
  }
  .field input.short { flex: none; width: 90px; font-family: Consolas, monospace; }
  .field input:focus { outline: none; border-color: var(--gold); }
  .item .name { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.you { background: rgba(230, 195, 106, .16); color: var(--gold); }
  .appid { display: flex; gap: 8px; }
  .appid input {
    width: 190px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: 13px Consolas, monospace; user-select: text;
  }
  .appid input:focus { outline: none; border-color: var(--gold); }

  .segmented { display: flex; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .segmented button {
    padding: 6px 12px; border: 0; border-radius: 7px; background: none; cursor: pointer;
    color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { color: var(--gold-ink); background: linear-gradient(180deg, var(--gold), var(--gold-2)); }

  .notice {
    display: none; align-items: center; gap: 12px; margin-bottom: 4px;
    padding: 12px 14px 12px 16px; border-radius: 12px; color: var(--gold);
    background: rgba(230, 195, 106, .08); border: 1px solid rgba(230, 195, 106, .35);
  }
  .notice.show { display: flex; }
  .notice span { flex: 1; color: var(--text); }
  .notice.update { max-width: 980px; margin-bottom: 18px; }
  #currentLobby { margin-bottom: 12px; }

  .toast {
    position: fixed; right: 22px; bottom: 22px; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 12px; font-weight: 600;
    color: var(--gold-ink); background: linear-gradient(180deg, var(--gold), var(--gold-2));
    box-shadow: 0 10px 26px rgba(0, 0, 0, .4);
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
  <aside role="tablist" aria-orientation="vertical">
    <div class="brand">
      <div class="logo">嶺</div>
      <div><b>Rinshan</b><small>for Tenhou</small></div>
    </div>
    <button class="nav" role="tab" data-tab="games"><svg class="i" data-icon="list"></svg><span data-i18n="navGames"></span></button>
    <button class="nav" role="tab" data-tab="lobbies"><svg class="i" data-icon="door"></svg><span data-i18n="navLobbies"></span></button>
    <button class="nav" role="tab" data-tab="display"><svg class="i" data-icon="volume"></svg><span data-i18n="navDisplay"></span></button>
    <button class="nav" role="tab" data-tab="options"><svg class="i" data-icon="sliders"></svg><span data-i18n="navOptions"></span></button>
    <div class="spacer"></div>
    <div class="keys">
      <kbd>F2</kbd><span data-i18n="keyMenu"></span>
      <kbd>F11</kbd><span data-i18n="keyFullscreen"></span>
      <kbd>F12</kbd><span data-i18n="keyScreenshot"></span>
      <kbd>Ctrl M</kbd><span data-i18n="keyMute"></span>
      <kbd>Esc</kbd><span data-i18n="keyHide"></span>
    </div>
    <button class="exit" data-cmd="exit"><svg class="i" data-icon="logout"></svg><span data-i18n="exit"></span></button>
  </aside>

  <main>
    <div class="notice update" id="updateBanner">
      <svg class="i" data-icon="download"></svg><span id="updateText"></span>
      <button class="btn ghost sm" data-cmd="releaseNotes" data-i18n="releaseNotes"></button>
      <button class="btn gold sm" data-cmd="installUpdate" id="installUpdate" data-i18n="installUpdate"></button>
    </div>
    <section data-panel="games">
      <h1 data-i18n="navGames"></h1>
      <p class="sub" data-i18n="gamesSub"></p>
      <div id="hero"></div>
      <div class="tools">
        <button class="btn ghost sm" data-cmd="clipboardReplay"><svg class="i" data-icon="clipboard"></svg><span data-i18n="openCopied"></span></button>
      </div>
      <div id="tableBlock">
        <h2 id="tableHeader"></h2>
        <div class="list" id="table"></div>
      </div>
      <h2>Nodocchi</h2>
      <div class="field">
        <input type="text" id="nodocchiName" spellcheck="false" data-i18n-placeholder="nodocchiPlaceholder">
        <button class="btn ghost sm" id="nodocchiSearch"><svg class="i" data-icon="search"></svg><span data-i18n="nodocchiSearch"></span></button>
      </div>
      <h2 data-i18n="history"></h2>
      <div class="list" id="history"></div>
    </section>

    <section data-panel="lobbies">
      <h1 data-i18n="navLobbies"></h1>
      <p class="sub" data-i18n="lobbiesSub"></p>
      <div class="notice" id="currentLobby">
        <svg class="i" data-icon="door"></svg><span id="currentLobbyText"></span>
        <button class="btn gold sm" id="saveCurrentLobby" data-i18n="saveLobby"></button>
      </div>
      <div class="list" id="lobbyList"></div>
      <h2 data-i18n="addLobbyHeader"></h2>
      <div class="field">
        <input type="text" id="lobbyId" class="short" placeholder="L1234" maxlength="5" spellcheck="false">
        <input type="text" id="lobbyName" maxlength="40" spellcheck="false" data-i18n-placeholder="lobbyNamePlaceholder">
        <button class="btn ghost sm" id="addLobby" data-i18n="saveLobby"></button>
      </div>
      <h2>Discord</h2>
      <div class="group">
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="discord"></svg></div>
          <div class="text"><b data-i18n="shareLobbyTitle"></b><span data-i18n="shareLobbyDesc"></span></div>
          <input type="checkbox" class="switch" id="shareLobby" data-toggle="option:shareLobby">
        </label>
      </div>
    </section>

    <section data-panel="display">
      <h1 data-i18n="navDisplay"></h1>
      <p class="sub" data-i18n="displaySub"></p>
      <div class="group">
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="camera"></svg></div>
          <div class="text"><b data-i18n="screenshotTitle"></b><span data-i18n="screenshotDesc"></span></div>
          <button class="btn ghost sm" data-cmd="openScreenshots" data-i18n="openFolder"></button>
          <button class="btn gold sm" data-cmd="screenshot" data-i18n="capture"></button>
        </div>
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="volume"></svg></div>
          <div class="text"><b data-i18n="muteTitle"></b><span data-i18n="muteDesc"></span></div>
          <input type="checkbox" class="switch" id="muted" data-toggle="mute">
        </label>
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="maximize"></svg></div>
          <div class="text"><b data-i18n="keyFullscreen"></b><span data-i18n="fullscreenDesc"></span></div>
          <input type="checkbox" class="switch" id="fullscreen" data-toggle="fullscreen">
        </label>
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="zoom"></svg></div>
          <div class="text"><b>Zoom</b><span data-i18n="zoomDesc"></span></div>
          <div class="zoom">
            <input type="range" id="zoom" min="50" max="200" step="5">
            <output id="zoomValue">100%</output>
            <button class="btn ghost sm" id="zoomReset">100%</button>
          </div>
        </div>
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="refresh"></svg></div>
          <div class="text"><b data-i18n="reloadTitle"></b><span data-i18n="reloadDesc"></span></div>
          <button class="btn ghost sm" data-cmd="reload" data-i18n="reload"></button>
        </div>
      </div>
    </section>

    <section data-panel="options">
      <h1 data-i18n="navOptions"></h1>
      <p class="sub" data-i18n="optionsSub"></p>
      <div class="notice" id="reloadNotice">
        <svg class="i" data-icon="refresh"></svg><span data-i18n="reloadNotice"></span>
        <button class="btn gold sm" data-cmd="reload" data-i18n="reload"></button>
      </div>
      <h2 data-i18n="languageHeader"></h2>
      <div class="group">
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="globe"></svg></div>
          <div class="text"><b data-i18n="languageTitle"></b><span data-i18n="languageDesc"></span></div>
          <div class="segmented" id="language">
            <button data-lang="auto" data-i18n="languageAuto"></button>
            <button data-lang="es">Español</button>
            <button data-lang="en">English</button>
            <button data-lang="pt">Português</button>
          </div>
        </div>
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="translate"></svg></div>
          <div class="text"><b data-i18n="translateTitle"></b><span data-i18n="translateDesc"></span></div>
          <input type="checkbox" class="switch" id="translateTenhou" data-toggle="option:translateTenhou">
        </label>
      </div>
      <h2 data-i18n="windowHeader"></h2>
      <div class="group">
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="tray"></svg></div>
          <div class="text"><b data-i18n="trayTitle"></b><span data-i18n="trayDesc"></span></div>
          <input type="checkbox" class="switch" id="minimizeToTray" data-toggle="option:minimizeToTray">
        </label>
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="shield"></svg></div>
          <div class="text"><b data-i18n="confirmTitle"></b><span data-i18n="confirmDesc"></span></div>
          <input type="checkbox" class="switch" id="confirmClose" data-toggle="option:confirmClose">
        </label>
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="sun"></svg></div>
          <div class="text"><b data-i18n="awakeTitle"></b><span data-i18n="awakeDesc"></span></div>
          <input type="checkbox" class="switch" id="keepAwake" data-toggle="option:keepAwake">
        </label>
      </div>
      <h2>Discord</h2>
      <div class="group">
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="discord"></svg></div>
          <div class="text"><b data-i18n="discordTitle"></b><span data-i18n="discordDesc"></span></div>
          <input type="checkbox" class="switch" id="discord" data-toggle="option:discord">
        </label>
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="key"></svg></div>
          <div class="text"><b data-i18n="appIdTitle"></b><span id="discordHint"></span></div>
          <div class="appid">
            <input type="text" id="discordAppId" placeholder="123456789012345678" inputmode="numeric" spellcheck="false">
            <button class="btn ghost sm" id="discordSave" data-i18n="save"></button>
          </div>
        </div>
      </div>
      <h2 data-i18n="thisWindowHeader"></h2>
      <div class="group">
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="pin"></svg></div>
          <div class="text"><b data-i18n="onTopTitle"></b><span data-i18n="onTopDesc"></span></div>
          <input type="checkbox" class="switch" id="panelOnTop" data-toggle="option:panelOnTop">
        </label>
      </div>
      <h2 data-i18n="updatesHeader"></h2>
      <div class="group">
        <label class="setting">
          <div class="icon"><svg class="i" data-icon="download"></svg></div>
          <div class="text"><b data-i18n="autoUpdateTitle"></b><span data-i18n="autoUpdateDesc"></span></div>
          <input type="checkbox" class="switch" id="checkUpdates" data-toggle="option:checkUpdates">
        </label>
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="info"></svg></div>
          <div class="text"><b id="versionTitle"></b><span id="updateStatus"></span></div>
          <button class="btn ghost sm" data-cmd="checkUpdates" id="checkNow" data-i18n="checkNow"></button>
        </div>
      </div>
      <h2 data-i18n="helpHeader"></h2>
      <div class="group">
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="bug"></svg></div>
          <div class="text"><b data-i18n="reportTitle"></b><span data-i18n="reportDesc"></span></div>
          <button class="btn ghost sm" data-cmd="reportIssue" data-i18n="reportButton"></button>
        </div>
        <div class="setting">
          <div class="icon"><svg class="i" data-icon="file"></svg></div>
          <div class="text"><b data-i18n="logTitle"></b><span data-i18n="logDesc"></span></div>

  var lang = 'es';
  function t(key) { return STRINGS[lang][key]; }
  function applyStrings() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (e) { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (e) { e.placeholder = t(e.dataset.i18nPlaceholder); });
  }
  function icon(name) {
    return '<svg class="i" viewBox="0 0 24 24">' + ICONS[name] + '</svg>';
  }
  function hydrateIcons(root) {
    root.querySelectorAll('svg[data-icon]').forEach(function (s) {
      s.setAttribute('viewBox', '0 0 24 24');
      s.innerHTML = ICONS[s.dataset.icon];
      s.removeAttribute('data-icon');
    });
  }

  var state = { games: [] };

  function send(cmd, extra) {
    var msg = { cmd: cmd };
    for (var k in extra || {}) msg[k] = extra[k];
    if (window.chrome && chrome.webview) chrome.webview.postMessage(JSON.stringify(msg));
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function button(label, cls, iconName, onClick, disabled, title) {
    var b = el('button', 'btn ' + cls);
    b.innerHTML = iconName ? icon(iconName) : '';
    b.appendChild(document.createTextNode(label));
    b.onclick = onClick;
    b.disabled = !!disabled;
    if (title) b.title = title;
    return b;
  }

  function nagaTitle(g) {
    return g.sanma ? t('nagaSanma') : t('nagaCredits');
  }

  function selectTab(name) {
    document.querySelectorAll('.nav').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab == name); });
    document.querySelectorAll('section').forEach(function (s) { s.classList.toggle('active', s.dataset.panel == name); });
  }

  function renderGames() {
    var hero = document.getElementById('hero');
    var history = document.getElementById('history');
    hero.textContent = '';
    history.textContent = '';

    if (!state.games.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('b', null, t('noGames')));
      empty.appendChild(document.createTextNode(t('noGamesDesc')));
      hero.appendChild(empty);
      return;
    }

    var g = state.games[0];
    var card = el('div', 'hero');
    var info = el('div', 'info');
    info.appendChild(el('div', 'eyebrow', t('lastGame')));
    info.appendChild(el('div', 'when', g.when));
    var chips = el('div', 'chips');
    chips.appendChild(el('span', 'chip', g.players));
    chips.appendChild(el('span', 'chip mono', g.id));
    info.appendChild(chips);
    card.appendChild(info);

    var actions = el('div', 'actions');
    actions.appendChild(button(t('mortal'), 'gold', 'spark', function () { send('review', { service: 'mortal', id: g.id }); }));
    var naga = button(t('naga'), 'violet', 'brain', function () { send('review', { service: 'naga', id: g.id }); }, g.sanma, nagaTitle(g));
    naga.appendChild(el('span', 'badge', g.sanma ? t('only4p') : t('credits')));
    actions.appendChild(naga);
    actions.appendChild(button(t('watch'), 'ghost', 'play', function () { send('replay', { id: g.id }); }));
    card.appendChild(actions);
    hero.appendChild(card);

    state.games.forEach(function (g) {
      var row = el('div', 'item');
      row.appendChild(el('span', 'date', g.when));
      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'chip', g.players));
      row.appendChild(meta);
      var acts = el('div', 'actions');
      acts.appendChild(button(t('replay'), 'ghost sm', 'play', function () { send('replay', { id: g.id }); }));
      acts.appendChild(button('Mortal', 'ghost sm', 'spark', function () { send('review', { service: 'mortal', id: g.id }); }));
      acts.appendChild(button('NAGA', 'violet sm', 'brain', function () { send('review', { service: 'naga', id: g.id }); }, g.sanma, nagaTitle(g)));
      acts.appendChild(button(t('copy'), 'ghost sm', 'copy', function () { send('copy', { id: g.id }); toast(); }));
      row.appendChild(acts);
      history.appendChild(row);
    });
  }

  function render(s) {
    state = s;
    if (s.lang && s.lang != lang && STRINGS[s.lang]) { lang = s.lang; applyStrings(); }
    ['muted', 'fullscreen', 'minimizeToTray', 'confirmClose', 'keepAwake', 'panelOnTop', 'discord', 'translateTenhou'].forEach(function (id) {
      document.getElementById(id).checked = !!s[id];
    });
    document.querySelectorAll('#language button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.lang == (s.language || 'auto'));
    });
    document.getElementById('reloadNotice').classList.toggle('show', !!s.reloadNeeded);
    renderUpdate(s);
    renderTable(s);
    renderLobbies(s);
    document.getElementById('shareLobby').checked = !!s.shareLobby;
    var appId = document.getElementById('discordAppId');
    if (document.activeElement != appId) appId.value = s.discordAppId || '';
    document.getElementById('discordHint').textContent = t(s.discordAppId ? 'appIdOwn' : s.discordBuiltIn ? 'appIdBuiltIn' : 'appIdNone');
    var pct = Math.round((s.zoom || 1) * 100);
    document.getElementById('zoom').value = pct;
    document.getElementById('zoomValue').textContent = pct + '%';
    renderGames();
  }

  function renderTable(s) {
    var players = s.table || [], list = document.getElementById('table');
    document.getElementById('tableBlock').style.display = players.length ? '' : 'none';
    document.getElementById('tableHeader').textContent = t(s.inGame ? 'tableNow' : 'tableLast');
    list.textContent = '';
    players.forEach(function (p) {
      var row = el('div', 'item');
      row.appendChild(el('span', 'name', p.name));
      var meta = el('div', 'meta');
      if (p.you) meta.appendChild(el('span', 'chip you', t('you')));
      if (p.rank) meta.appendChild(el('span', 'chip', p.rank));
      if (p.rate) meta.appendChild(el('span', 'chip', p.rate));
      row.appendChild(meta);
      var acts = el('div', 'actions');
      acts.appendChild(button('Nodocchi', 'ghost sm', 'user', function () { send('nodocchi', { name: p.name }); }));
      row.appendChild(acts);
      list.appendChild(row);
    });
  }

  function renderLobbies(s) {
    var lobbies = s.lobbies || [], list = document.getElementById('lobbyList');
    var current = s.currentLobby, saved = lobbies.some(function (l) { return l.id == current; });
    document.getElementById('currentLobby').classList.toggle('show', !!current && !saved);
    if (current) document.getElementById('currentLobbyText').textContent = t('inLobby').replace('{id}', current);
    list.textContent = '';
    if (!lobbies.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('b', null, t('noLobbies')));
      empty.appendChild(document.createTextNode(t('noLobbiesDesc')));
      list.appendChild(empty);
      return;
    }
    lobbies.forEach(function (l) {
      var row = el('div', 'item');
      row.appendChild(el('span', 'date', 'L' + l.id));
      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'name', l.name));
      if (l.id == current) meta.appendChild(el('span', 'chip you', t('here')));
      row.appendChild(meta);
      var acts = el('div', 'actions');
      acts.appendChild(button(t('join'), 'gold sm', 'door', function () { send('joinLobby', { id: l.id }); }, s.inGame || l.id == current));
      acts.appendChild(button(t('remove'), 'ghost sm', 'trash', function () { send('removeLobby', { id: l.id }); }));
      row.appendChild(acts);
      list.appendChild(row);
    });
  }

  function renderUpdate(s) {
    var status = s.updateStatus || 'idle', v = s.updateVersion;
    function fill(key) { return t(key).replace('{v}', v); }
    document.getElementById('checkUpdates').checked = !!s.checkUpdates;
    document.getElementById('versionTitle').textContent = 'Rinshan v' + s.version;
    document.getElementById('updateStatus').textContent = fill(
      status == 'failed' ? (v ? 'updateInstallFailed' : 'updateFailed') :
      'update' + status.charAt(0).toUpperCase() + status.slice(1));
    document.getElementById('checkNow').disabled = status == 'checking' || status == 'installing';
    var banner = document.getElementById('updateBanner');
    banner.classList.toggle('show', !!v);
    if (!v) return;
    document.getElementById('updateText').textContent = fill(
      status == 'installing' ? 'updateInstalling' : status == 'failed' ? 'updateInstallFailed' : 'bannerAvailable');
    document.getElementById('installUpdate').disabled = status == 'installing';
  }

  var toastTimer;
  function toast() {
    var t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  hydrateIcons(document);
  applyStrings();
  document.querySelectorAll('#language button').forEach(function (b) {
    b.onclick = function () { send('language', { value: b.dataset.lang }); };
  });
  document.querySelectorAll('.nav').forEach(function (t) { t.onclick = function () { selectTab(t.dataset.tab); }; });
  document.querySelectorAll('[data-cmd]').forEach(function (b) { b.onclick = function () { send(b.dataset.cmd); }; });
  document.querySelectorAll('[data-toggle]').forEach(function (c) {
    c.onchange = function () {
      var parts = c.dataset.toggle.split(':');
      send(parts[0], parts[1] ? { name: parts[1] } : null);
    };
  });
  var zoom = document.getElementById('zoom');
  zoom.oninput = function () { document.getElementById('zoomValue').textContent = zoom.value + '%'; };
  zoom.onchange = function () { send('zoom', { value: zoom.value / 100 }); };
  document.getElementById('zoomReset').onclick = function () { send('zoom', { value: 1 }); };
  function saveAppId() { send('discordAppId', { value: document.getElementById('discordAppId').value.trim() }); document.getElementById('discordAppId').blur(); }
  document.getElementById('discordSave').onclick = saveAppId;
  function searchNodocchi() {
    var name = document.getElementById('nodocchiName').value.trim();
    if (name) send('nodocchi', { name: name });
  }
  document.getElementById('nodocchiSearch').onclick = searchNodocchi;
  document.getElementById('nodocchiName').onkeydown = function (e) { if (e.key == 'Enter') searchNodocchi(); };
  function addLobby() {
    var id = document.getElementById('lobbyId'), name = document.getElementById('lobbyName');
    var digits = id.value.replace(/^[Ll]/, '').trim();
    if (!/^[1-9][0-9]{3}$/.test(digits)) { id.focus(); id.select(); return; }
    send('saveLobby', { id: digits, name: name.value.trim() });
    id.value = name.value = '';
  }
  document.getElementById('addLobby').onclick = addLobby;
  ['lobbyId', 'lobbyName'].forEach(function (f) {
    document.getElementById(f).onkeydown = function (e) { if (e.key == 'Enter') addLobby(); };
  });
  document.getElementById('saveCurrentLobby').onclick = function () {
    document.getElementById('lobbyId').value = 'L' + state.currentLobby;
    document.getElementById('lobbyName').focus();
  };
  document.getElementById('discordAppId').onkeydown = function (e) { if (e.key == 'Enter') saveAppId(); };
  window.addEventListener('keydown', function (e) {
    if (e.key == 'Escape' || e.key == 'F2') { e.preventDefault(); send('close'); }
    else if (e.key == 'F11') { e.preventDefault(); send('fullscreen'); }
    else if (e.ctrlKey && (e.key == 'm' || e.key == 'M')) { e.preventDefault(); send('mute'); }
  });

  selectTab('games');
</script>
</body>
</html>
